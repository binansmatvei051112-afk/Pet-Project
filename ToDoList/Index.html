<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Board</title>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="ToDoList.css">
</head>
<body>

    <div class="bg-orb bg-orb--1"></div>
    <div class="bg-orb bg-orb--2"></div>
    <div class="bg-orb bg-orb--3"></div>

    <div class="app">

        <!-- ===== ШАПКА ===== -->
        <header class="header">
            <div class="header__logo">
                <span class="header__logo-icon">✦</span>
                <h1 class="header__title">Kanban</h1>
            </div>

            <div class="header__controls">
                <!-- Инпут для новой задачи -->
                <div class="input-wrap">
                    <input
                        type="text"
                        id="Tasck_input"
                        class="input-wrap__field"
                        placeholder="Новая задача..."
                        autocomplete="off"
                    >
                    <p class="input-wrap__error" id="error_msg"></p>
                </div>

                <button id="push_btn" class="btn btn--primary">
                    <span class="btn__icon">+</span>
                    Добавить
                </button>

                <button id="Delete_btn" class="btn btn--danger">
                    <span class="btn__icon">⌫</span>
                    Очистить
                </button>
            </div>
        </header>

        <main class="board">

            <div class="column" id="Do_column">
                <div class="column__header">
                    <div class="column__title-wrap">
                        <span class="column__dot column__dot--todo"></span>
                        <h2 class="column__title">Сделать</h2>
                    </div>
                    <span class="column__counter" id="do_count">0</span>
                </div>
            </div>

            <div class="column" id="Process_column">
                <div class="column__header">
                    <div class="column__title-wrap">
                        <span class="column__dot column__dot--doing"></span>
                        <h2 class="column__title">В процессе</h2>
                    </div>
                    <span class="column__counter" id="process_count">0</span>
                </div>
            </div>

            <div class="column" id="Finished_column">
                <div class="column__header">
                    <div class="column__title-wrap">
                        <span class="column__dot column__dot--done"></span>
                        <h2 class="column__title">Готово</h2>
                    </div>
                    <span class="column__counter" id="finished_count">0</span>
                </div>
            </div>

        </main>

    </div>

    <script src="ToDoList.js"></script>
</body>
</html>
